name: .NET-sonar
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v4
    
    ## FIXED: Removed 'sudo' and combined dependencies, Wine, Java, and PowerShell into one step
    - name: Install Dependencies, Wine, Java, and PowerShell
      run: |
        # 1. Enable 32-bit architecture for Wine
        dpkg --add-architecture i386
        apt-get update
        
        # 2. Install base tools, Wine (for cswinrt.exe), and Java (for SonarScanner)
        apt-get install -y curl wget libssl1.1 apt-transport-https software-properties-common wine64 wine32 binfmt-support openjdk-17-jre
        
        # 3. Install Microsoft repository keys and PowerShell (fixes the 'pwsh' code 127 error)
        wget -q "https://packages.microsoft.com/config/ubuntu/20.04/packages-microsoft-prod.deb"
        dpkg -i packages-microsoft-prod.deb
        apt-get update
        apt-get install -y powershell
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install SonarScanner
      run: |
        dotnet tool install --global dotnet-sonarscanner
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        
    - name: SonarScanner Begin
      # Friendly reminder: You really should move this token to GitHub Secrets!
      run: dotnet sonarscanner begin /k:"vcatest_UniGetUI" /o:"vcatest" /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e" /d:sonar.host.url="https://sonarcloud.io/"
      
    - name: Build Project
      working-directory: ./src
      run: dotnet build -p:EnableWindowsTargeting=true -p:PostBuildEvent= -p:GenerateResourceUsePreserializedResources=true
      
    - name: SonarScanner End
      run: dotnet sonarscanner end /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e"
